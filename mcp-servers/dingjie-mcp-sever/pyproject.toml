[project]
name = "dingjie-erp-mcp"
version = "0.1.0"
description = "MCP Server for Dingjie ERP E10 — connect AI assistants to 鼎捷 ERP via natural language"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Jiang Lang" }]
keywords = ["mcp", "mcp-server", "dingjie", "鼎捷", "e10", "erp", "claude", "llm", "ai", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.26.0,<2",
    "requests>=2.31.0",
    "python-dotenv>=1.2.1,<2",
]

[project.scripts]
dingjie-erp-mcp = "dingjie_erp_mcp.server:main"

[project.urls]
Homepage = "https://github.com/user/dingjie-erp-mcp"
Repository = "https://github.com/user/dingjie-erp-mcp"
Issues = "https://github.com/user/dingjie-erp-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dingjie_erp_mcp"]
artifacts = ["src/dingjie_erp_mcp/py.typed"]

[dependency-groups]
dev = [
    "mcp[cli]>=1.26.0,<2",
    "pytest>=9.0.2",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.9",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
