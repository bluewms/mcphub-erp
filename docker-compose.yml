# MCPHub + ERP MCP Servers 部署配置
# 用法：cp .env.example .env && 编辑 .env && docker compose up -d

services:
  # ─────────────────────────────────────────────
  # PostgreSQL：存储 mcphub 配置（服务器列表、用户、密钥等）
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:17
    container_name: mcphub-postgres
    environment:
      POSTGRES_DB: mcphub
      POSTGRES_USER: mcphub
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mcphub_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcphub"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - mcphub-network

  # ─────────────────────────────────────────────
  # MCPHub：MCP Server 管理面板
  # 镜像内置 uv + node，可直接运行挂载的 Python MCP Server
  # ─────────────────────────────────────────────
  mcphub:
    image: samanhappy/mcphub:latest
    container_name: mcphub
    environment:
      # 数据库连接（设置 DB_URL 自动启用数据库模式）
      DB_URL: "postgresql://mcphub:${DB_PASSWORD:-mcphub_password}@postgres:5432/mcphub"
      PORT: 3000
      NODE_ENV: production
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-mcphub2024}

      # ── 鼎捷 ERP 互联中台 ──
      DINGJIE_SERVER_URL: ${DINGJIE_SERVER_URL:-}
      DINGJIE_KEY: ${DINGJIE_KEY:-}
      DINGJIE_ENT_ID: ${DINGJIE_ENT_ID:-}
      DINGJIE_COMPANY_ID: ${DINGJIE_COMPANY_ID:-}
      DINGJIE_TARGET_PROD: ${DINGJIE_TARGET_PROD:-E10}
      DINGJIE_LANG: ${DINGJIE_LANG:-zh_CN}
      DINGJIE_TIMEOUT: ${DINGJIE_TIMEOUT:-30}
      DINGJIE_VERIFY_SSL: ${DINGJIE_VERIFY_SSL:-1}
      MCP_MODE: ${MCP_MODE:-readonly}

      # ── 金蝶云星空 K3Cloud ──
      KD_ACCT_ID: ${KD_ACCT_ID:-}
      KD_USERNAME: ${KD_USERNAME:-}
      KD_APP_ID: ${KD_APP_ID:-}
      KD_APP_SEC: ${KD_APP_SEC:-}
      KD_SERVER_URL: ${KD_SERVER_URL:-}
      KD_LCID: ${KD_LCID:-2052}
      KD_ORG_NUM: ${KD_ORG_NUM:-}

      # ── Odoo（通过 odoo_config.json 配置，见 README）──
      ODOO_CONFIG_PATH: ${ODOO_CONFIG_PATH:-/app/mcp-servers/mcp-odoo/odoo_config.json}

      # ── 可选：内网 Python 包镜像（离线/加速）──
      # UV_DEFAULT_INDEX: https://pypi.example.com/simple/
      # npm_config_registry: https://registry.npmmirror.com/
    volumes:
      # 挂载所有 MCP Server 源码到容器内
      # 改代码后在 Dashboard 点 reload 即可生效，无需重新构建镜像
      - ./mcp-servers:/app/mcp-servers
      # 持久化 mcphub 运行时数据（密钥缓存等）
      - mcphub-data:/app/data
    ports:
      - "${MCPHUB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mcphub-network

volumes:
  pgdata:
    driver: local
  mcphub-data:
    driver: local

networks:
  mcphub-network:
    driver: bridge
